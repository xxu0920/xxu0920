name: Update Weather

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动跑一次
  workflow_dispatch: # 支持手动点击运行

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Weather
        id: weather_step
        run: |
          # 1. 严格过滤：强制指定中国长沙（Changsha），并且只要最干净的单行格式（format=3）
          # 加了 -sSfL 参数，如果接口再次抽风发图表，直接抓取失败改用备用文字，防止污染主页
          WEATHER_DATA=$(curl -sSfL "https://wttr.in" || echo "🌦️ 长沙天气同步中...")
          
          # 2. 打印在日志里方便我们肉眼检查
          echo "本次抓取到的单行天气为: $WEATHER_DATA"
          
          # 3. 将变量写入 GitHub 的全局环境变量缓存中（这是工业级最安全的做法）
          echo "WEATHER_INFO=$WEATHER_DATA" >> $GITHUB_ENV

      - name: xxu0920
        run: |
          # 4. 用最安全的 cat 重新生成 README.md，将环境变量精准注入
          # ⚠️ 注意：把下面代码里的 "你的GitHub用户名" 替换成你真实的 GitHub 用户名
          cat << 'EOF' > README.md
          ## 🌦️ 长沙实时天气看板

          > ⏰ **今日城市天气**：${{ env.WEATHER_INFO }}
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "数据未发生变化，无需推送。"
          else
            git commit -m "🤖 自动同步最新长沙天气数据"
            git push
          fi
