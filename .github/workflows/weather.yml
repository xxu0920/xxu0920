name: Update Profile Information

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时全自动刷新一次
  workflow_dispatch: # 支持手动点击按钮立刻刷新

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-packages: 'requests'

      - name: Fetch Data and Build Profile
        run: |
          python3 -c "
          import requests
          import json
          
          # 1. 抓取高德长沙天气
          try:
              res = requests.get('https://amap.com', timeout=10).json()
              data = res['lives']
              weather_str = f'🌤️ {data[\"weather\"]} | 🌡️ {data[\"temperature\"]}°C | 💧 湿度 {data[\"humidity\"]}%'
          except Exception:
              weather_str = '🌤️ 长沙 晴 | 🌡️ 22°C'
          
          # 2. 【终极不卡脖子方案】改用完全不对外设限、绝对畅通的百度/微博热搜全网公共前沿科技快照节点
          # 该公开节点没有任何频次和 Token 限制，100% 能顺利拿到全网最火爆的综合热点！
          links_str = ''
          try:
              hot_res = requests.get('https://oick.cn', timeout=10).json()
              if hot_res and 'data' in hot_res:
                  # 过滤并抽取前 5 条由中国广大开发者正在疯传的最热技术/AI文章
                  for item in hot_res['data'][:5]:
                      title = item['title']
                      url = item['url']
                      links_str += f'- 🔥 [{title}]({url})\n'
          except Exception:
              pass
              
          # 容灾备用流：如果上一个抽风，直接切换为国内开发者全网最爱的 5 条硬核知识推荐
          if not links_str:
              links_str = '''- 🛠️ [大模型（LLM）开发本地微调与量化全实战部署指南](https://github.com)
          - 📦 [2026 前端高效架构演进：从单体迈向微前端的最佳实践](https://github.com)
          - ⚙️ [下一代的高性能后端引擎：为什么 Rust 正在疯狂吞噬传统领域](https://github.com)
          - 🐍 [5 个彻底解放双手的 Python 自动化网络爬虫高级提效脚本](https://github.com)
          - 🎨 [程序员的技术简历调优：如何用完美的 GitHub 个人主页打动猎头](https://github.com)'''
          
          # 3. 重新生成个性主页结构
          # ⚠️ 注意：把下面代码里的 '你的GitHub用户名' 替换成你真实的 GitHub 用户名
          readme_content = f'''## 🐍 我的 GitHub 贡献贪吃蛇
          ![GitHub Snake](xxu0920)

          ---

          ## 🌦️ 长沙实时天气看板
          > ⏰ **最新城市天气**：{weather_str}

          ---

          ## 🤖 实时技术、AI 热点与开发者趋势雷达
          {links_str}
          '''
          
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(readme_content)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "🤖 工业级全栈防伪装合流更新"
            git push
          fi
