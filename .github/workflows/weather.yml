name: Update Weather

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch: 

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-packages: 'requests' 

      - name: Get Changsha Weather and Build README
        run: |
          python3 -c "
          import requests
          
          try:
              res = requests.get('https://amap.com', timeout=10).json()
              if res['status'] == '1' and res['lives']:
                  data = res['lives']
                  weather_str = f'🌤️ {data[\"weather\"]} | 🌡️ {data[\"temperature\"]}°C | 💧 湿度 {data[\"humidity\"]}%'
              else:
                  weather_str = '🌤️ 长沙 晴 | 🌡️ 22°C'
          except Exception:
              weather_str = '🌤️ 长沙 晴 | 🌡️ 22°C'
          
          # ⚠️ 注意：把下面代码里的 '你的GitHub用户名' 替换成你真实的 GitHub 用户名
          readme_content = f'''## 🐍 我的 GitHub 贡献贪吃蛇
          ![GitHub Snake](https://githubusercontent.com)

          ---

          ## 🌦️ 长沙实时天气看板
          > ⏰ **最新城市天气**：{weather_str}

          ---

          ## 🤖 最新技术、AI 学习与 GitHub 趋势项目
          <!-- BLOG-POST-LIST:START -->
          <!-- BLOG-POST-LIST:END -->
          '''
          
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(readme_content)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "🤖 自动同步最新长沙天气"
            git push
          fi
