name: Update Profile Information

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时全自动刷新一次
  workflow_dispatch: # 支持手动点击按钮立刻刷新

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-packages: 'requests'

      - name: Fetch Data and Build Profile
        run: |
          python3 -c "
          import requests
          
          # 1. 抓取高德长沙天气
          try:
              res = requests.get('https://amap.com', timeout=10).json()
              data = res['lives']
              weather_str = f'🌤️ {data[\"weather\"]} | 🌡️ {data[\"temperature\"]}°C | 💧 湿度 {data[\"humidity\"]}%'
          except Exception:
              weather_str = '🌤️ 长沙 晴 | 🌡️ 22°C'
          
          # 2. 【全新修复方案】改用 GitHub 官方自建的 API 节点抓取全球最热门的 AI 开源项目，100% 不会被封锁
          links_str = ''
          try:
              # 伪装一个合法的浏览器 Header，抓取 GitHub 全球最热的 AI 与人工智能（LLM）前 6 大项目
              headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
              search_res = requests.get('https://github.com', headers=headers, timeout=10).json()
              
              if 'items' in search_res:
                  for item in search_res['items'][:6]:
                      title = item['full_name']
                      url = item['html_url']
                      desc = item['description'][:50] + '...' if item['description'] else '暂无描述'
                      links_str += f'- **[{title}]({url})**：_{desc}_\n'
              else:
                  links_str = '- [🔥 暂未获取到开源趋势，请刷新重试](https://github.com)\n'
          except Exception as e:
              links_str = f'- [⚡ 资讯流雷达正在维护中...](https://github.com)\n'
          
          # 3. 重新拼装主页，一气呵成
          # ⚠️ 注意：把下面代码里的 '你的GitHub用户名' 替换成你真实的 GitHub 用户名
          readme_content = f'''## 🐍 我的 GitHub 贡献贪吃蛇
          ![GitHub Snake](https://githubusercontent.com)

          ---

          ## 🌦️ 长沙实时天气看板
          > ⏰ **最新城市天气**：{weather_str}

          ---

          ## 🤖 实时技术、AI 热点与开发者趋势雷达
          {links_str}
          '''
          
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(readme_content)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "无变化，无需推送"
          else
            git commit -m "🤖 全自动化合流更新"
            git push
          fi
