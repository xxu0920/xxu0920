name: Update Weather

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动跑一次
  workflow_dispatch: # 支持手动点击运行

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Pure Text Weather README
        run: |
          # 1. 采用高稳定性的纯净 API 节点获取长沙天气，只拿单行干净的文本
          WEATHER_DATA=$(curl -sSfL "https://wttr.in" || echo "🌦️ 长沙天气同步中...")
          echo "本次过滤出来的极简天气数据: $WEATHER_DATA"
          
          # 2. 【核心修复】直接在当前环境用 shell 变量写入，不用跨步骤 env 传递，彻底杜绝 GitHub 的 env 报错！
          # ⚠️ 注意：请把下面第 21 行的 "你的GitHub用户名" 替换成你真实的 GitHub 用户名
          cat << EOF > README.md
          ## 🐍 我的 GitHub 贡献贪吃蛇
          ![GitHub Snake](https://githubusercontent.com)

          ---

          ## 🌦️ 长沙实时天气看板

          > ⏰ **最新城市天气**：长沙 $WEATHER_DATA
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "数据未发生变化，无需推送。"
          else
            git commit -m "🤖 自动同步最新长沙天气"
            git push
          fi
