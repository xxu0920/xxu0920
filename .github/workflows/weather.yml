name: Update Weather

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动跑一次
  workflow_dispatch: # 支持手动点击运行

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Weather and Build README
        run: |
          # 1. 抓取干净的一行长沙天气
          WEATHER_DATA=$(curl -sSfL "https://wttr.in" || echo "☀️ 天气数据获取中")
          echo "抓取到的长沙天气: $WEATHER_DATA"
          
          # 2. 【最稳固的做法】直接用脚本重新把主页内容重写一遍，绝对不会出现标签找不到的情况
          # 注意：把下面第 17 行代码里的 "你的GitHub用户名" 替换成你真实的 GitHub 用户名
          cat << EOF > README.md
          ## 🐍 我的 GitHub 贡献贪吃蛇
          ![GitHub Snake](https://githubusercontent.com)

          ---

          ## 🌦️ 长沙实时天气看板

          > ⏰ **今日天气同步**：$WEATHER_DATA
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "天气没有变化，无需更新。"
          else
            git commit -m "🤖 自动更新长沙天气看板"
            git push
          fi
