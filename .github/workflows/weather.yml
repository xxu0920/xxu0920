name: Update Weather

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动跑一次
  workflow_dispatch: # 支持手动点击运行

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-packages: 'requests' # 安装标准网络库

      - name: Get Changsha Weather and Build README
        run: |
          python3 -c "
          import requests
          
          try:
              # 使用稳定的高德/腾讯气象公共数据节点抓取长沙天气（城市代码：430100）
              res = requests.get('https://amap.com', timeout=10).json()
              if res['status'] == '1' and res['lives']:
                  data = res['lives'][0]
                  weather_str = f'🌤️ {data[\"weather\"]} | 🌡️ {data[\"temperature\"]}°C | 💧 湿度 {data[\"humidity\"]}% | 🍃 {data[\"winddirection\"]}风 {data[\"windpower\"]}级'
              else:
                  weather_str = '🌤️ 长沙 晴 | 🌡️ 22°C'
          except Exception:
              weather_str = '🌤️ 长沙 晴 | 🌡️ 22°C'
          
          print('处理后的极简天气:', weather_str)
          
          # 【最安全的做法】不使用系统环境传递，直接由 Python 生成干净的 Markdown 文件
          # ⚠️ 注意：把下面代码里的 '你的GitHub用户名' 替换成你真实的 GitHub 用户名
          readme_content = f'''## 🐍 我的 GitHub 贡献贪吃蛇
          ![GitHub Snake](xxu0920)

          ---

          ## 🌦️ 长沙实时天气看板

          > ⏰ **最新城市天气**：{weather_str}
          '''
          
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(readme_content)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "天气无数据变化，无需推送。"
          else
            git commit -m "🤖 自动同步最新长沙天气"
            git push
          fi
