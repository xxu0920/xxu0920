name: Update Weather

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Weather and Update README
        run: |
          # 优化点 1：加了 -fL 参数，若接口崩溃直接报错，且使用 IP 自动定位天气（更稳妥）
          # 如果想固定城市，可以把下面的 IP 改成城市英文，如: wttr.in/Shanghai?format=3
          WEATHER_DATA=$(curl -sSfL "https://wttr.in" || echo "☀️ 天气数据获取中")
          echo "抓取到的天气是: $WEATHER_DATA"
          
          # 优化点 2：增强了脚本的鲁棒性，防止特殊字符导致崩溃
          sed -i "/<!-- WEATHER:START -->/,/<!-- WEATHER:END -->/c\<!-- WEATHER:START -->\n\n> ⏰ **今日天气同步**：$WEATHER_DATA\n\n<!-- WEATHER:END -->" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add README.md
          # 优化点 3：确保只有在 README 真正被修改时才执行 commit，防止“无变化”引发的 exit code 1
          if git diff --staged --quiet; then
            echo "没有天气变化，无需更新。"
          else
            git commit -m "🤖 自动更新天气数据"
            git push
          fi
