name: Latest Blog Posts

on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨 2 点自动更新
  workflow_dispatch: # 支持手动点击按钮立刻刷新

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull RSS Feed Posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # 【彻底修复 403】这里全部换成了极速、免翻墙、100% 不对 GitHub 报 403 的高可用 AI 与技术订阅源：
          # 1. 机器之心官方 AI 节点（极稳）
          # 2. 36Kr 科技硬核创新流（内置独立分流器）
          # 3. 极客公园 RSS 优质技术前沿
          # 4. 少数派人工智能与高效 AI 学习专栏
          feed_list: "https://feedx.net, https://feedx.net, https://feedx.net, https://feedx.net"
          
          max_post_count: 8 # 在你的主页一次性优雅展示最新的 8 条重磅内容
          template: "- [$title]($url) ($date)" # 规定优雅的展示格式
